<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的网页</title>
<style>
  :root{
    --primary:#4f7cff;
    --primary-dark:#3560e0;
    --text:#1f2430;
    --muted:#6b7280;
    --bg:#f6f8fc;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
  }
  /* 顶部导航 */
  header{
    position:sticky;top:0;z-index:10;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(8px);
    border-bottom:1px solid #e8ecf5;
  }
  nav{
    max-width:960px;margin:0 auto;
    padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:10px;
  }
  .logo{font-weight:700;font-size:18px;color:var(--primary);}
  .nav-links{display:flex;gap:18px;flex-wrap:wrap;}
  .nav-links a{
    color:var(--muted);text-decoration:none;font-size:15px;
    transition:color .2s;
  }
  .nav-links a:hover{color:var(--primary);}

  /* 首屏 */
  .hero{
    max-width:960px;margin:0 auto;
    padding:72px 20px 56px;
    text-align:center;
  }
  .hero h1{
    font-size:clamp(28px,5vw,44px);
    letter-spacing:-.5px;
    margin-bottom:16px;
  }
  .hero h1 span{color:var(--primary);}
  .hero p{
    color:var(--muted);font-size:clamp(15px,2.2vw,18px);
    max-width:560px;margin:0 auto 28px;
  }
  .btn{
    display:inline-block;
    padding:12px 28px;
    border-radius:999px;
    background:var(--primary);
    color:#fff;text-decoration:none;font-weight:600;
    border:none;cursor:pointer;font-size:16px;
    transition:transform .2s, background .2s;
    box-shadow:0 6px 18px rgba(79,124,255,.32);
  }
  .btn:hover{background:var(--primary-dark);transform:translateY(-2px);}
  .btn.ghost{
    background:transparent;color:var(--primary);
    border:2px solid var(--primary);box-shadow:none;
    margin-left:10px;
  }
  .btn.ghost:hover{background:rgba(79,124,255,.08);}

  /* 卡片区 */
  .cards{
    max-width:960px;margin:0 auto 64px;
    padding:0 20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    padding:26px 22px;
    box-shadow:0 2px 14px rgba(31,36,48,.06);
    transition:transform .25s, box-shadow .25s;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 26px rgba(31,36,48,.12);
  }
  .card .icon{font-size:26px;margin-bottom:10px;}
  .card h3{font-size:17px;margin-bottom:8px;}
  .card p{color:var(--muted);font-size:14.5px;}

  /* 计数器演示 */
  .counter{
    max-width:960px;margin:0 auto 64px;padding:0 20px;text-align:center;
  }
  .counter-box{
    display:inline-flex;align-items:center;gap:16px;
    background:var(--card);border-radius:999px;
    padding:10px 18px;box-shadow:0 2px 14px rgba(31,36,48,.08);
  }
  .counter-box button{
    width:38px;height:38px;border-radius:50%;
    border:none;background:#eef2ff;color:var(--primary);
    font-size:20px;cursor:pointer;transition:background .2s;
  }
  .counter-box button:hover{background:#dde5ff;}
  #count{font-size:22px;font-weight:700;min-width:48px;}

  /* 页脚 */
  footer{
    text-align:center;padding:28px 20px;
    color:var(--muted);font-size:14px;
    border-top:1px solid #e8ecf5;
  }
  @media (max-width:480px){
    .btn.ghost{margin-left:0;margin-top:10px;}
  }
</style>
</head>
<body>

<header>
  <nav>
    <div class="logo">MySite</div>
    <div class="nav-links">
      <a href="#features">功能</a>
      <a href="#demo">演示</a>
      <a href="#contact">联系</a>
    </div>
  </nav>
</header>

<section class="hero">
  <h1>你好，这是一个<span>漂亮的网页</span></h1>
  <p>纯 HTML + CSS + JavaScript 单文件实现，响应式布局，打开即可使用。</p>
  <a class="btn" href="#features">开始了解</a>
  <a class="btn ghost" href="#contact">联系我</a>
</section>

<section class="cards" id="features">
  <div class="card">
    <div class="icon">📱</div>
    <h3>响应式设计</h3>
    <p>自适应手机、平板和桌面，任何屏幕都有良好体验。</p>
  </div>
  <div class="card">
    <div class="icon">⚡</div>
    <h3>轻量快速</h3>
    <p>无任何第三方依赖，单个文件，加载速度极快。</p>
  </div>
  <div class="card">
    <div class="icon">🎨</div>
    <h3>易于修改</h3>
    <p>使用 CSS 变量统一配色，改一个值即可换整站风格。</p>
  </div>
</section>

<section class="counter" id="demo">
  <h3 style="margin-bottom:16px;">交互演示</h3>
  <div class="counter-box">
    <button onclick="change(-1)" aria-label="减少">−</button>
    <span id="count">0</span>
    <button onclick="change(1)" aria-label="增加">+</button>
  </div>
</section>

<footer id="contact">
  © 2025 MySite · 由我为你生成
</footer>

<script>
  let count = 0;
  const el = document.getElementById('count');
  function change(delta){
    count += delta;
    el.textContent = count;
    el.style.color = count > 0 ? '#16a34a' : count < 0 ? '#dc2626' : '#1f2430';
  }
</script>

</body>
</html>
